<!doctype html><html lang="en"><meta charset="utf-8"><title>PDF Extractor · independent browser engines</title><style>body{font:16px system-ui;background:#12151b;color:#e8edf5;margin:3rem;max-width:1100px}h1{font-size:2rem}p{color:#b6c3d5}button{padding:12px 18px;margin:10px 10px 10px 0;background:#88b8ff;border:0;border-radius:8px;font-weight:700}pre{white-space:pre-wrap;line-height:1.5;background:#202735;padding:24px;border-radius:12px}#pulse{display:inline-block;background:#86e4b4;padding:8px;color:#10251c;border-radius:8px}small{color:#afbdd1}</style><h1>PDF Extractor</h1><p>Independent TypeScript and Dart engines. PDF bytes stay in this browser. Extraction runs in a dedicated worker.</p><span id="pulse">UI heartbeat: 0</span><p><button onclick="run('ts')">Test TypeScript</button><button onclick="run('dart')">Test Dart</button></p><small>43-page requested paper · text, tables, images and structured blocks</small><pre id="result">Ready. Worker loading and extraction are measured separately.</pre><script src="/browser-timing.js"></script><script>
let ticks=0;setInterval(()=>document.querySelector('#pulse').textContent='UI heartbeat: '+(++ticks),100);
window.run=async(engine,name='harness',format='markdown')=>{const input=await(await fetch('/pdf/'+name+'.pdf')).arrayBuffer(),start=performance.now(),worker=new Worker('/'+engine+'-worker.js'),before=ticks;document.querySelector('#result').textContent='Extracting with '+engine+'…';return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{worker.terminate();reject(Error('deadline'));},65000);worker.onerror=e=>{clearTimeout(timer);worker.terminate();document.querySelector('#result').textContent=e.message;reject(Error(e.message));};worker.onmessage=async({data})=>{clearTimeout(timer);worker.terminate();const result={engine,pdf:name,wallMs:performance.now()-start,heartbeatTicks:ticks-before,stats:data.stats,complete:data.complete,error:data.error,warnings:data.warnings?.length};window.lastResult=data;window.lastSummary=result;document.querySelector('#result').textContent=JSON.stringify(result,null,2);resolve(result);};worker.postMessage({id:1,bytes:input,format},[input]);});};

window.runCorpus=async(engine)=>{
 const manifest=await(await fetch('/manifest.json')).json(),files=manifest.files.filter(f=>f.path.endsWith('.pdf'));window.corpus={engine,total:files.length,done:0,errors:0};
 const worker=new Worker('/'+engine+'-worker.js');
 try{for(const file of files){const pdf=file.path.replace(/^bench_data\/pdfs\//,''),bytes=await(await fetch('/corpus/'+pdf)).arrayBuffer(),start=performance.now();const data=await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('deadline '+pdf)),65000);worker.onmessage=({data})=>{clearTimeout(timer);resolve(data);};worker.onerror=e=>{clearTimeout(timer);reject(Error(e.message));};worker.postMessage({id:1,bytes,format:'markdown'},[bytes]);});const row={engine,pdf,markdown:data.result||'',error:data.error,stats:data.stats,warnings:data.warnings,wallMs:performance.now()-start};const response=await fetch('/results',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(row)});if(!response.ok)throw Error('Saving result failed');window.corpus.done++;if(data.error)window.corpus.errors++;document.querySelector('#result').textContent=JSON.stringify(window.corpus,null,2);}}finally{worker.terminate();}
 return window.corpus;
};
</script>
