<title>City Council Approves New Bike Lanes</title>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"NewsArticle","headline":"City Council Approves New Bike Lanes","author":{"@type":"Person","name":"Jane Jacobs"},"datePublished":"2025-09-30T18:00:00-04:00","articleBody":"The city council voted 7 to 2 on Tuesday night to approve forty kilometres of protected bike lanes, the largest expansion in the city's history.\n\nSupporters packed the chamber for more than four hours of public comment. Many described close calls with cars on the routes they ride to work and school every day.\n\nOpponents argued that removing parking would hurt small businesses along the commercial corridors, and asked the council to delay the vote until a traffic study is complete.\n\nThe plan's first phase begins next spring on Main Street and Fifth Avenue. The transportation department says the full network will take three years to build and will be paid for with state grants.\n\nCouncil member Ortiz, who proposed the plan, said the vote showed the city is ready to choose safety over speed. The mayor is expected to sign the measure this week."}</script>
