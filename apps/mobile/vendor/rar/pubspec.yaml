name: rar
description: >
  RAR (4 and 5) extraction for The Reader's comic import: libarchive through
  FFI on Android, UnrarKit on iOS. Trimmed and patched from rar 0.3.0.
version: 0.3.0+thereader.1
publish_to: 'none'

environment:
  sdk: '>=3.4.4 <4.0.0'
  flutter: '>=3.3.0'


dependencies:
  ffi: ^2.1.4
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        pluginClass: RarPlugin
