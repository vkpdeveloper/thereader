// FFI-only Android plugin: builds libthereader_rar.so with libarchive.
group = "com.lkrjangid.rar"
version = "1.0"

apply plugin: "com.android.library"

android {
    namespace = "com.lkrjangid.rar"
    compileSdk = 36
    ndkVersion = android.ndkVersion

    externalNativeBuild {
        cmake {
            path = "CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 24
    }
}
