name: thereader
description: "The Reader: a calm, offline-first EPUB reader."
publish_to: 'none'
version: 0.1.0+2

environment:
  sdk: ^3.11.4
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.3.0
  crypto: ^3.0.7
  flutter_readium:
    path: vendor/flutter_readium
  flutter_widget_from_html_core: ^0.17.4
  http: ^1.6.0
  path: ^1.9.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  xml: ^7.0.1
  file_picker: 13.1.0
  flutter_svg: ^2.3.0
  kindle_unpack: 0.2.0
  html: ^0.15.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/samples/
    - assets/fonts/LiterataOFL.txt
    - assets/fonts/SourceSerif4OFL.txt
    - assets/fonts/AtkinsonHyperlegibleNextOFL.txt
    - assets/fonts/LexendOFL.txt
    - assets/fonts/InterOFL.txt
  # Reading fonts. The native reader serves these same files into the EPUB
  # web view (see lib/core/typography/reader_fonts.dart); keep paths in sync.
  fonts:
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata.ttf
        - asset: assets/fonts/Literata-Italic.ttf
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
        - asset: assets/fonts/Inter-Italic.ttf
          style: italic
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4.ttf
        - asset: assets/fonts/SourceSerif4-Italic.ttf
          style: italic
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext.ttf
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Italic.ttf
          style: italic
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend.ttf
